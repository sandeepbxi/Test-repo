version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt
  build:
    commands:
      - echo "Packaging Elastic Beanstalk application..."

artifacts:
  files:
    - application.py
    - requirements.txt
    - Procfile
    - buildspec.yml
